<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
class Review {
    constructor(db) {
        this.db = db;
    }

    async create(studentId, subject, rating, comment, reportRatio) {
        return await this.db.request('createReview', { studentId, subject, rating, comment, reportRatio });
    }

    async getAll() {
        return await this.db.request('getAllReviews', {});
    }

    async delete(studentId, createdAt) {
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser') || '{}');
        return await this.db.request('deleteReview', { studentId, createdAt, requester: currentUser.studentId || '' });
    }

    // ★修正: いいね切り替え用API
    async toggleLike(studentId, createdAt, requester) {
        return await this.db.request('toggleLikeReview', { studentId, createdAt, requester });
    }
}
window.Review = Review;
</script>
</body>
</html>
