<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
class Database {
    constructor() {
        // 設定済みの GAS 実行 URL（ユーザー提供、修正済み）
        this.gasUrl = "https://script.google.com/macros/s/AKfycbyXv7idsojIoqL-MHAMCnLak9M9JVmK8e5JBGudGNjucX6i0iWciMem13XR4_awD9enOg/exec";
    }

    async request(action, data) {
        try {
            const response = await fetch(this.gasUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain'
                },
                cache: 'no-store', // ★追加: 強力なキャッシュ無効化（常に最新を取得）
                redirect: 'follow', // GASの仕様対応
                body: JSON.stringify({ action: action, data: data })
            });

            const result = await response.json();
            if (result && result.success === false && /不明なアクション|未対応のアクション/.test(result.error || '')) {
                console.warn('GASがcreateUserを未対応のため、ローカル保存へ切り替えます。');
                return this.localRequest(action, data);
            }
            return result;
        } catch (error) {
            console.warn("Fetchエラー (フォールバック処理に切替):", error);
            return this.localRequest(action, data);
        }
    }

    // フォールバック用のローカル処理（localStorageベース）
    async localRequest(action, data) {
        const USERS_KEY = 'kamokun_users';
        const REVIEWS_KEY = 'kamokun_reviews';

        const load = (key) => JSON.parse(localStorage.getItem(key) || '[]');
        const save = (key, arr) => localStorage.setItem(key, JSON.stringify(arr));
        const sameReview = (review, request) => {
            if (request.reviewId && review.id && String(review.id) === String(request.reviewId)) return true;
            return String(review.studentId || '') === String(request.studentId || '') &&
                new Date(review.createdAt).getTime() === new Date(request.createdAt).getTime();
        };

        if (action === 'createUser') {
            const users = load(USERS_KEY);
            const exists = users.some(u => u.studentId === data.studentId);
            if (exists) return { success: false, error: 'この学籍番号は既に登録されています。' };
            users.push({ studentId: data.studentId, password: data.password });
            save(USERS_KEY, users);
            // 他フレーム互換のためにwindow.dbを更新
            window.db = window.db || {};
            window.db.users = users;
            return { success: true, data: { studentId: data.studentId } };
        }

        if (action === 'login') {
            const users = load(USERS_KEY);
            const user = users.find(u => u.studentId === data.studentId && u.password === data.password);
            if (!user) return { success: false, error: '学籍番号またはパスワードが間違っています。' };
            return { success: true, user: { studentId: user.studentId } };
        }

        if (action === 'getUsers') {
            const users = load(USERS_KEY);
            return { success: true, data: users };
        }

        if (action === 'createReview') {
            const reviews = load(REVIEWS_KEY);
            const now = new Date().toISOString();
            const id = 'r-' + Math.random().toString(36).slice(2, 9);
            const review = Object.assign({ id: id, createdAt: now, likes: 0, likedBy: [] }, data);
            reviews.unshift(review);
            save(REVIEWS_KEY, reviews);
            return { success: true, data: review };
        }

        if (action === 'getAllReviews') {
            const reviews = load(REVIEWS_KEY).filter(review => review.studentId && review.createdAt);
            return { success: true, data: reviews };
        }

        if (action === 'deleteReview') {
            const reviews = load(REVIEWS_KEY);
            // 要求者をセッションストレージから取得
            let requester = null;
            try {
                const s = sessionStorage.getItem('currentUser');
                requester = s ? JSON.parse(s).studentId : null;
            } catch (e) { requester = null; }

            const targetIndex = reviews.findIndex(r => sameReview(r, data));
            if (targetIndex < 0) return { success: false, error: '対象の投稿が見つかりません。' };

            const target = reviews[targetIndex];
            // 削除権限チェック：作成者または管理者(J24025)
            if (requester !== target.studentId && requester !== 'J24025') {
                return { success: false, error: '削除権限がありません。' };
            }

            reviews.splice(targetIndex, 1);
            save(REVIEWS_KEY, reviews);
            return { success: true };
        }

        if (action === 'toggleLikeReview') {
            const reviews = load(REVIEWS_KEY);
            const idx = reviews.findIndex(r => sameReview(r, data));
            if (idx < 0) return { success: false, error: '投稿が見つかりません。' };
            if (!data.requester) return { success: false, error: 'ログインユーザーを確認できません。' };
            const likedBy = Array.isArray(reviews[idx].likedBy) ? reviews[idx].likedBy : [];
            const userIndex = likedBy.indexOf(data.requester);
            if (userIndex >= 0) likedBy.splice(userIndex, 1);
            else likedBy.push(data.requester);
            reviews[idx].likedBy = likedBy;
            reviews[idx].likes = likedBy.length;
            save(REVIEWS_KEY, reviews);
            return { success: true, likes: reviews[idx].likes, liked: userIndex < 0 };
        }

        return { success: false, error: '未対応のアクションです: ' + action };
    }
}
window.Database = Database;

// 簡易互換のため、localStorageの存在データをwindow.dbとして露出しておく
(function() {
    try {
        const users = JSON.parse(localStorage.getItem('kamokun_users') || '[]');
        window.db = window.db || {};
        window.db.users = users;
    } catch (e) {
        window.db = window.db || {};
        window.db.users = [];
    }
})();
</script>
</body>
</html>
